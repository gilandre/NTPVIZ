# Configuration Apache pour NTP Monitor Enterprise
# Ubuntu 24.04 + Apache 2.4 + mod_wsgi

<VirtualHost *:80>
    ServerName ntp-monitor.local
    ServerAlias localhost
    DocumentRoot /var/www/ntp-monitor-enterprise
    
    # Redirection HTTPS (optionnel)
    # Redirect permanent / https://ntp-monitor.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName ntp-monitor.local
    ServerAlias localhost
    DocumentRoot /var/www/ntp-monitor-enterprise
    
    # SSL Configuration (optionnel)
    # SSLEngine on
    # SSLCertificateFile /etc/ssl/certs/ntp-monitor.crt
    # SSLCertificateKeyFile /etc/ssl/private/ntp-monitor.key
    
    # Configuration WSGI
    WSGIDaemonProcess ntp-monitor python-home=/var/www/ntp-monitor-enterprise/venv python-path=/var/www/ntp-monitor-enterprise
    WSGIProcessGroup ntp-monitor
    WSGIScriptAlias / /var/www/ntp-monitor-enterprise/app.wsgi
    
    # Répertoires de l'application
    <Directory /var/www/ntp-monitor-enterprise>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Fichiers statiques
    Alias /static /var/www/ntp-monitor-enterprise/frontend/static
    <Directory /var/www/ntp-monitor-enterprise/frontend/static>
        Require all granted
        
        # Cache pour les fichiers statiques
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpg "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/gif "access plus 1 month"
            ExpiresByType image/ico "access plus 1 month"
        </IfModule>
        
        # Compression
        <IfModule mod_deflate.c>
            SetOutputFilter DEFLATE
            AddOutputFilterByType DEFLATE text/plain
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/xml
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE application/xhtml+xml
            AddOutputFilterByType DEFLATE application/rss+xml
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/x-javascript
        </IfModule>
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/ntp-monitor_error.log
    CustomLog ${APACHE_LOG_DIR}/ntp-monitor_access.log combined
    LogLevel info
    
    # Sécurité
    <IfModule mod_headers.c>
        # HTTPS sécurisé
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set X-Frame-Options DENY
        Header always set X-Content-Type-Options nosniff
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # CSP (Content Security Policy)
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' cdn.jsdelivr.net; connect-src 'self' ws: wss:;"
    </IfModule>
    
    # Configuration WebSocket (pour SocketIO)
    RewriteEngine On
    RewriteCond %{REQUEST_URI}  ^/socket.io            [NC]
    RewriteCond %{QUERY_STRING} transport=websocket    [NC]
    RewriteRule /(.*)           ws://localhost:5000/$1 [P,L]
    
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /socket.io/ http://localhost:5000/socket.io/
    ProxyPassReverse /socket.io/ http://localhost:5000/socket.io/
    
    # Optimisations
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
    </IfModule>
    
    # Empêcher l'accès aux fichiers sensibles
    <FilesMatch "\.(py|pyc|pyo|db|sqlite|log|ini|conf)$">
        Require all denied
    </FilesMatch>
    
    <Directory /var/www/ntp-monitor-enterprise/backend>
        Require all denied
    </Directory>
    
    <Directory /var/www/ntp-monitor-enterprise/config>
        Require all denied
    </Directory>
    
    <Directory /var/www/ntp-monitor-enterprise/logs>
        Require all denied
    </Directory>
</VirtualHost>

# Configuration globale Apache pour NTP Monitor
<IfModule mod_wsgi.c>
    # Optimisations WSGI
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On
    WSGIScriptReloading On
</IfModule>

