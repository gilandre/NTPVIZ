name: CI/CD NTP Monitor Enterprise

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

env:
  PYTHON_VERSION: 3.11

jobs:
  # =============================================================================
  # TESTS ET VALIDATION
  # =============================================================================
  
  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-flask pytest-cov flake8 black safety bandit

    - name: 🔍 Code quality - Linting
      run: |
        # Vérification du style de code
        flake8 backend/ --max-line-length=100 --exclude=__pycache__
        
        # Vérification du formatage
        black --check backend/ --line-length=100

    - name: 🛡️ Security scan
      run: |
        # Vérification des vulnérabilités des dépendances
        safety check -r requirements.txt
        
        # Analyse de sécurité du code
        bandit -r backend/ -f json -o bandit-report.json || true

    - name: 🧪 Run tests
      env:
        FLASK_ENV: testing
        DATABASE_URL: sqlite:///:memory:
        SECRET_KEY: test-secret-key-for-ci
      run: |
        # Créer les répertoires nécessaires
        mkdir -p logs instance
        
        # Lancer les tests avec couverture
        pytest tests/ -v \
          --cov=backend/ \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=70

    - name: 📊 Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: 📤 Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report-${{ matrix.python-version }}
        path: bandit-report.json

  # =============================================================================
  # VALIDATION FRONTEND
  # =============================================================================
  
  frontend-validation:
    name: Validation Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🌐 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🔍 Validate JavaScript
      run: |
        # Installation de ESLint pour validation JS
        npm install -g eslint
        
        # Validation basique du JavaScript
        find frontend/static/js -name "*.js" -not -path "*/vendor/*" | xargs -r ls -la

    - name: 🎨 Validate CSS
      run: |
        # Validation des fichiers CSS
        find frontend/static/css -name "*.css" -not -path "*/vendor/*" | xargs -r ls -la

  # =============================================================================
  # BUILD ET PACKAGING
  # =============================================================================
  
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, frontend-validation]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build wheel

    - name: 🏗️ Build package
      run: |
        # Créer un package de distribution
        python -m build

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: dist/

  # =============================================================================
  # TESTS D'INTÉGRATION
  # =============================================================================
  
  integration-tests:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: build
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ntp_monitor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🗄️ Test MySQL connection
      env:
        DATABASE_URL: mysql+pymysql://root:test_password@localhost:3306/ntp_monitor_test
      run: |
        python -c "
        import pymysql
        import os
        from backend.app import create_app
        
        # Test connexion MySQL
        conn = pymysql.connect(
            host='localhost',
            user='root', 
            password='test_password',
            database='ntp_monitor_test'
        )
        print('✅ Connexion MySQL réussie')
        conn.close()
        
        # Test création app avec MySQL
        os.environ['DATABASE_URL'] = 'mysql+pymysql://root:test_password@localhost:3306/ntp_monitor_test'
        app = create_app()
        print('✅ Application créée avec MySQL')
        "

    - name: 🧪 Run integration tests
      env:
        DATABASE_URL: mysql+pymysql://root:test_password@localhost:3306/ntp_monitor_test
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key-for-integration
      run: |
        # Tests d'intégration avec base MySQL
        python -c "
        import os
        from backend.app import create_app, db
        
        app = create_app()
        with app.app_context():
            db.create_all()
            print('✅ Tables créées en base')
        
        print('✅ Tests d\'intégration MySQL réussis')
        "

  # =============================================================================
  # DÉPLOIEMENT AUTOMATIQUE
  # =============================================================================
  
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: [test, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to staging
      run: |
        echo "🚀 Déploiement vers l'environnement de staging"
        echo "URL: https://staging.ntp-monitor.exemple.com"
        # Ajouter ici les scripts de déploiement réels

    - name: 📧 Notification deployment
      if: always()
      run: |
        echo "📧 Notification de déploiement envoyée"
        echo "Status: ${{ job.status }}"

  # =============================================================================
  # RELEASE AUTOMATIQUE
  # =============================================================================
  
  release:
    name: Création de release
    runs-on: ubuntu-latest
    needs: [test, integration-tests, build]
    if: github.event_name == 'release'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: dist/

    - name: 🚀 Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/
        asset_name: ntp-monitor-enterprise-${{ github.event.release.tag_name }}
        asset_content_type: application/zip

    - name: 🐳 Build and push Docker image
      run: |
        echo "🐳 Construction de l'image Docker"
        echo "Tag: ${{ github.event.release.tag_name }}"
        # Ajouter ici les commandes Docker

# =============================================================================
# CONFIGURATION GLOBALE
# =============================================================================

# Variables d'environnement par défaut pour tous les jobs
env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1 