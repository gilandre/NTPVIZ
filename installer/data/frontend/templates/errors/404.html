{% extends "base.html" %}

{% block title %}Page non trouvée - EmaraudeNTP VIZ{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card error-card">
                <div class="card-header bg-warning text-dark text-center">
                    <h2 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Erreur 404
                    </h2>
                </div>
                <div class="card-body text-center">
                    <div class="error-icon mb-4">
                        <i class="fas fa-search fa-5x text-muted"></i>
                    </div>
                    <h3 class="text-primary mb-3">Page non trouvée</h3>
                    <p class="text-muted mb-4">
                        La page que vous recherchez n'existe pas ou a été déplacée.
                    </p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-emerald">
                            <i class="fas fa-home me-2"></i>
                            Retour au tableau de bord
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>
                            Page précédente
                        </button>
                    </div>
                </div>
                <div class="card-footer bg-light text-center">
                    <small class="text-muted">
                        <i class="fas fa-gem me-1"></i>
                        EmaraudeNTP VIZ - Monitoring NTP
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-card {
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    border: none;
    margin-top: 50px;
}

.error-icon i {
    opacity: 0.5;
}

.btn-emerald {
    background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-dark));
    border: none;
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-emerald:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
    color: white;
}
</style>
{% endblock %}
