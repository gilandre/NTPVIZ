<!-- Modal Configuration Avancée -->
<div class="modal fade" id="configModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="fas fa-cog me-2"></i>Configuration Système
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body p-0">
                <!-- Loading Spinner -->
                <div id="config-loading-spinner" class="text-center p-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                    <div class="mt-2">Chargement de la configuration...</div>
                </div>
                
                <div class="row no-gutters h-100">
                    <!-- Menu des catégories -->
                    <div class="col-md-3 border-end bg-light">
                        <div class="config-sidebar p-3">
                            <h6 class="text-muted mb-3">
                                <i class="fas fa-list me-2"></i>Catégories
                            </h6>
                            <div id="config-categories-menu" class="categories-menu">
                                <!-- Les catégories seront chargées dynamiquement -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Contenu de configuration -->
                    <div class="col-md-9">
                        <div class="config-main p-4">
                            <div id="config-content">
                                <!-- Le contenu sera chargé dynamiquement -->
                                <div class="config-welcome text-center">
                                    <i class="fas fa-cogs fa-3x text-muted mb-3"></i>
                                    <h4 class="text-muted">Configuration Système</h4>
                                    <p class="text-muted">
                                        Sélectionnez une catégorie dans le menu de gauche pour commencer la configuration.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer bg-light">
                <div class="d-flex justify-content-between w-100">
                    <div class="config-status">
                        <span id="config-status-text" class="text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Prêt pour la configuration
                        </span>
                    </div>
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times me-1"></i>Fermer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Styles CSS pour la configuration -->
<style>
/* Configuration Sidebar */
.config-sidebar {
    height: 600px;
    overflow-y: auto;
}

.categories-menu .category-item {
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid #e9ecef;
}

.categories-menu .category-item:hover {
    background-color: #f8f9fa;
    border-color: #007bff;
    transform: translateX(4px);
}

.categories-menu .category-item.active {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
}

.categories-menu .category-item.active .badge {
    background-color: rgba(255, 255, 255, 0.2) !important;
}

.category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}

.category-header i {
    margin-right: 8px;
    width: 16px;
}

.category-name {
    font-weight: 500;
    flex-grow: 1;
}

.category-description {
    font-size: 0.85em;
    opacity: 0.8;
    line-height: 1.3;
}

/* Configuration Content */
.config-main {
    height: 600px;
    overflow-y: auto;
}

.config-category-header {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e9ecef;
}

.config-category-header h3 {
    margin-bottom: 8px;
    color: #495057;
}

.config-actions {
    margin-top: 15px;
}

.config-actions .btn {
    margin-right: 8px;
}

.config-actions .btn.pulse {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* Configuration Form */
.config-form {
    display: grid;
    gap: 25px;
}

.config-field-group {
    padding: 20px;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    background-color: #fdfdfd;
    transition: border-color 0.3s ease;
}

.config-field-group:hover {
    border-color: #007bff;
}

.config-field-group label {
    font-weight: 600;
    color: #495057;
    margin-bottom: 8px;
}

.config-field-group .form-control {
    border-radius: 6px;
    border: 1px solid #ced4da;
    padding: 10px 12px;
    transition: all 0.3s ease;
}

.config-field-group .form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

.config-field-group .form-control.is-invalid {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.field-validation-error {
    color: #dc3545;
    font-size: 0.875em;
    margin-top: 5px;
    display: none;
}

.field-validation-error::before {
    content: "⚠ ";
}

/* Form Switch */
.form-check.form-switch {
    padding-left: 2.5em;
}

.form-switch .form-check-input {
    width: 2em;
    height: 1.2em;
    margin-left: -2.5em;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='rgba%280,0,0,.25%29'/%3e%3c/svg%3e");
}

/* Footer */
.config-footer {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #e9ecef;
}

/* Welcome Screen */
.config-welcome {
    padding: 60px 20px;
}

.config-welcome .fa-3x {
    opacity: 0.4;
}

/* Responsive */
@media (max-width: 768px) {
    .modal-dialog.modal-xl {
        max-width: 95%;
        margin: 10px auto;
    }
    
    .config-sidebar {
        height: 200px;
    }
    
    .config-main {
        height: 400px;
    }
    
    .categories-menu .category-item {
        padding: 8px;
        margin-bottom: 4px;
    }
    
    .category-description {
        display: none;
    }
}

/* Animations */
.fade-in {
    animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Status Indicators */
.status-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
}

.status-indicator.status-success {
    background-color: #28a745;
}

.status-indicator.status-warning {
    background-color: #ffc107;
}

.status-indicator.status-error {
    background-color: #dc3545;
}

.status-indicator.status-info {
    background-color: #17a2b8;
}

/* Tooltips */
.config-tooltip {
    position: relative;
    cursor: help;
}

.config-tooltip:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 1000;
}

/* JSON Editor */
.json-editor {
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
    line-height: 1.4;
    background-color: #f8f9fa;
}

/* Loading States */
.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.loading-spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #007bff;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<!-- Scripts JavaScript pour la configuration -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialiser quand la modal est ouverte
    const configModal = document.getElementById('configModal');
    if (configModal) {
        configModal.addEventListener('shown.bs.modal', function() {
            if (typeof ConfigManager !== 'undefined' && !window.configManager) {
                window.configManager = new ConfigManager();
            }
        });
        
        // Nettoyage quand la modal est fermée
        configModal.addEventListener('hidden.bs.modal', function() {
            if (window.configManager && window.configManager.isDirty) {
                // Optionnel: demander confirmation si des changements non sauvegardés
            }
        });
    }
});

// Fonction pour ouvrir la modal de configuration
function openConfigModal() {
    const modal = new bootstrap.Modal(document.getElementById('configModal'));
    modal.show();
}

// Fonction pour ouvrir une catégorie spécifique
function openConfigCategory(category) {
    openConfigModal();
    
    // Attendre que la modal soit ouverte et que ConfigManager soit initialisé
    setTimeout(() => {
        if (window.configManager) {
            window.configManager.loadCategory(category);
        }
    }, 500);
}
</script>
