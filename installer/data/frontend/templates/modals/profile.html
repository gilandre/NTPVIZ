<!-- Modal Profil Utilisateur -->
<div class="modal fade" id="profileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-user me-2"></i>Profil Utilisateur
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="profileForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="profileUsername" class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" id="profileUsername" 
                                       value="{{ current_user.username }}" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="profileRole" class="form-label">Rôle</label>
                                <input type="text" class="form-control" id="profileRole" 
                                       value="{{ current_user.role.title() }}" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="profileEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="profileEmail" 
                               value="{{ current_user.email }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="profileFirstName" class="form-label">Prénom</label>
                                <input type="text" class="form-control" id="profileFirstName" 
                                       value="{{ current_user.first_name or '' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="profileLastName" class="form-label">Nom</label>
                                <input type="text" class="form-control" id="profileLastName" 
                                       value="{{ current_user.last_name or '' }}">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" onclick="saveProfile()">Sauvegarder</button>
            </div>
        </div>
    </div>
</div>
